[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mde-config-builder"
version = "0.1.0"
description = "Interactive builder for Microsoft Defender for Endpoint macOS configuration profiles, driven by Microsoft's published schema."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["macos", "defender", "mde", "mdm", "jamf", "intune", "mobileconfig", "device-control"]
authors = [{ name = "mac@ team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Nicer arrow-key interactive UI. The tool runs without it (stdlib fallback).
tui = ["questionary>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "pre-commit>=3.0",
]

[project.scripts]
mde-builder = "mdebuilder.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/mde-config-builder"
Issues = "https://github.com/your-org/mde-config-builder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mdebuilder"]


[tool.hatch.build]
include = ["src/mdebuilder/**"]

# --- tooling ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
packages = ["mdebuilder"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --cov=mdebuilder --cov-report=term-missing"
